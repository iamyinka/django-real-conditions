# Version-manifest validation stack. Not a course project: see README.md.
name: stackcheck

x-app: &app
  build: .
  environment: &env
    DB_HOST: db
    BROKER_URL: ${BROKER_URL:-redis://redis:6379}
  depends_on: &deps
    db: {condition: service_healthy}
    redis: {condition: service_started}
    valkey: {condition: service_started}
    s3: {condition: service_started}

services:
  db:
    image: postgres:18.6-trixie
    environment: {POSTGRES_DB: check, POSTGRES_USER: check, POSTGRES_PASSWORD: check}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U check -d check"]
      interval: 2s
      retries: 20
  redis:
    image: redis:8.8.4-trixie
  valkey:
    image: valkey/valkey:9.0.7-trixie
  s3:
    image: chrislusf/seaweedfs:4.52
    command: server -s3 -dir=/data -ip=s3 -ip.bind=0.0.0.0
  worker:
    <<: *app
    command: celery -A stackcheck worker --loglevel=warning --concurrency=1
  gunicorn:
    <<: *app
    command: gunicorn stackcheck.wsgi -b 0.0.0.0:8000
  uvicorn:
    <<: *app
    command: uvicorn stackcheck.asgi:application --host 0.0.0.0 --port 8000
  daphne:
    <<: *app
    command: daphne -b 0.0.0.0 -p 8000 stackcheck.asgi:application
  tests:
    <<: *app
    depends_on:
      <<: *deps
      worker: {condition: service_started}
      gunicorn: {condition: service_started}
      uvicorn: {condition: service_started}
      daphne: {condition: service_started}
    profiles: [run]
    command: ./run-checks.sh
