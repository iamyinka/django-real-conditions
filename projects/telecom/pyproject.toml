[project]
name = "telecom"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django==6.1.3",
    "psycopg[binary]==3.3.8",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-django==4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--strict-markers -ra"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes basics; I: import sorting; B: likely bugs; DJ: Django-specific checks
select = ["E", "F", "I", "B", "DJ", "UP"]
