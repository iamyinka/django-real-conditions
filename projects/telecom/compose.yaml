# Local development stack for the telecom app.
#   cd projects/telecom && cp .env.example .env && docker compose up -d --build
#
# Compose reads .env from this directory for two separate purposes:
#   1. ${VAR} interpolation inside this file
#   2. env_file: passes every variable into the web container's environment
name: telecom

services:
  web:
    build: .
    env_file: .env
    ports:
      # host_ip:host_port:container_port. Binding to 127.0.0.1 keeps the dev server
      # off your LAN. A bare "8001:8000" listens on every interface, and Docker's
      # port publishing can bypass a host firewall.
      - "127.0.0.1:8001:8000"
    volumes:
      # Bind mount: your project directory on the host appears at /app in the container.
      # Edits show up instantly and runserver auto-reloads. The venv lives at /opt/venv
      # (baked into the image), so this mount doesn't hide the installed dependencies.
      - .:/app
    # Wait for the database (bounded), then serve. depends_on below already covers
    # `docker compose up`. wait_for_db also covers `run --no-deps` and platforms without Compose.
    command: >-
      sh -c "python manage.py wait_for_db --timeout 30 &&
             exec python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        # The short form (`- db`) waits only until the container has *started*. This waits
        # until db's healthcheck passes, which means Postgres is accepting connections.
        condition: service_healthy
    healthcheck:
      # Liveness (/healthz), not readiness: if this checked the database, a db outage would
      # mark web unhealthy too, and the real problem would be harder to see.
      # The slim image has no curl, so use Python's standard library. urlopen raises on
      # 4xx/5xx and connection errors, which gives a non-zero exit, which means unhealthy.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s   # failures during startup don't count against retries
      start_interval: 1s  # but probe often during it, so "healthy" arrives quickly

  db:
    image: postgres:18.6-trixie
    environment:
      # Pass only what Postgres needs, not the whole .env (it doesn't need Django's secret key).
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Named volume: Docker manages the storage, and it outlives any container.
      # Postgres 18 images keep data under /var/lib/postgresql/18/docker. Mount the PARENT
      # (/var/lib/postgresql), which is what the image declares as its VOLUME. Older tutorials
      # mount /var/lib/postgresql/data. On 18.6, that makes the container exit (code 1)
      # with a message explaining the new layout (tested 2026-11-07).
      - pgdata:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1 forces TCP. On first start, the image runs a temporary server that
      # listens only on a Unix socket while it creates the database. A socket-based
      # pg_isready can report "ready" during that phase, just before the server restarts.
      # $$ escapes Compose interpolation, so the shell inside the container expands the variables.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s
    # No "ports:" here: the database is reachable only from containers on this project's
    # network (as db:5432), not from your host or LAN.

volumes:
  pgdata:  # removed only by `docker compose down -v` or `docker volume rm telecom_pgdata`
