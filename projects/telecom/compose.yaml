# Local development stack for the telecom app.
#   cd projects/telecom && cp .env.example .env && docker compose up -d --build
#
# Compose reads .env from this directory for two separate purposes:
#   1. ${VAR} interpolation inside this file
#   2. env_file: passes every variable into the web container's environment
name: telecom

services:
  web:
    build: .
    env_file: .env
    ports:
      # host_ip:host_port:container_port. Binding to 127.0.0.1 keeps the dev server
      # off your LAN. A bare "8001:8000" listens on every interface, and Docker's
      # port publishing can bypass a host firewall.
      - "127.0.0.1:8001:8000"
    depends_on:
      - db  # start order only. "Started" doesn't mean "ready to accept connections" (see M1.8).

  db:
    image: postgres:18.6-trixie
    environment:
      # Pass only what Postgres needs, not the whole .env (it doesn't need Django's secret key).
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # No "ports:" here: the database is reachable only from containers on this project's
    # network (as db:5432), not from your host or LAN.
