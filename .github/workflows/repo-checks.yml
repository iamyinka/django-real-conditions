# Runs the same pre-commit hooks as developers run locally, on every PR and push to main.
# Its job name ("repo-checks") is a required status check on main.
name: repo-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repo-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0               # full history so gitleaks can scan every commit in the PR

      - uses: astral-sh/setup-uv@v10

      - name: Run pre-commit hooks on all files
        run: uvx pre-commit@4.7.0 run --all-files --show-diff-on-failure

      - name: Scan the full Git history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose
