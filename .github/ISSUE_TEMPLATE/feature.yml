name: Feature or change
description: A business problem to solve, with scope and acceptance criteria
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Business problem
      description: Who is affected, what goes wrong today, and why it matters.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What this change includes, and what it explicitly does not.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable, testable conditions. Use a checklist.
      value: |
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: project
    attributes:
      label: Project
      options: [telecom, telehealth, streaming, labtrack, intranet, repository-wide]
    validations:
      required: true
